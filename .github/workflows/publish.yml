name: Publish to npm on tag

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'


      # npm Trusted Publishing (OIDC) needs npm >= 11.5.1; the Node
      # version above ships an older npm. Pin 11.6.2 for reproducible runs
      # (11.5.2 fixed an OIDC/provenance ordering bug, 11.6.2 resolves
      # trusted-publishing failures seen in the wild).
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.6.2
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Update package.json version from GitHub release tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          echo "TAG_NAME=${TAG_NAME}"
          TAG_STRIPPED="${TAG_NAME#v}"
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: ${CURRENT_VERSION}"
          echo "Target version: ${TAG_STRIPPED}"
          if [ "${CURRENT_VERSION}" = "${TAG_STRIPPED}" ]; then
            echo "package.json version is already ${CURRENT_VERSION}. Skipping npm version."
          else
            echo "Updating package.json version to: ${TAG_STRIPPED}"
            npm version ${TAG_STRIPPED} --no-git-tag-version
          fi

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Publish to npm
        run: npm publish --provenance --access public
